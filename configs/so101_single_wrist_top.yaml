# Step 1: 組立済み単腕 SO-101 (Leader + Follower) + 手首カメラ + 俯瞰カメラ設定
project:
  name: "pai2026_adv1_so101_single"
  omnicampus_id: "REPLACE_WITH_OMNICAMPUS_ID"
  task_description: "Pick up the target object using wrist camera feedback and place it into the designated sorting tray."

robot:
  type: "so101_follower"
  leader_type: "so101_leader"
  # 第3回講義実践: udevシンボリックリンクまたは固定シリアルパスを指定
  leader_port: "/dev/ttyACM0"      # 推奨: /dev/ttySO101_leader_1
  follower_port: "/dev/ttyACM1"    # 推奨: /dev/ttySO101_follower_1
  baudrate: 1000000
  dof: 6
  joint_names:
    - "shoulder_pan"
    - "shoulder_lift"
    - "elbow_flex"
    - "wrist_flex"
    - "wrist_roll"
    - "gripper"

cameras:
  wrist:
    index_or_path: "/dev/video0"   # 推奨: /dev/cam_so101_wrist_1
    fps: 30
    width: 640
    height: 480
    color_mode: "rgb"
  top:
    index_or_path: "/dev/video2"   # 推奨: /dev/cam_so101_top
    fps: 30
    width: 640
    height: 480
    color_mode: "rgb"

dataset:
  repo_id: "local/so101_wrist_pick_sort"
  root: "data/so101_wrist_pick_sort"
  fps: 30
  num_episodes: 40
  episode_time_s: 25
  reset_time_s: 10
  warmup_time_s: 3

policy:
  type: "act"                      # act | diffusion | smolvla
  chunk_size: 16                   # 第2回・第5回講義準拠: 将来16ステップ予測
  n_action_steps: 1                # Temporal Ensemble有効時は1ステップずつ更新
  temporal_ensemble_coeff: 0.01
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  dropout: 0.1

training:
  steps: 30000
  batch_size: 16
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  seed: 42
  save_freq: 5000
  eval_freq: 5000
  output_dir: "outputs/train/act_so101_single"
