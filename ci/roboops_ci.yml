name: RoboOps Quality & Safety CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-safety-and-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install numpy pyyaml pytest opencv-python-headless pillow matplotlib reportlab
      - name: Check Zero Personal Information (PII Scanner)
        run: |
          python3 scripts/check_no_pii.py
      - name: Run Dataset Validator Self-Test (Day 2 & Day 5 RoboOps)
        run: |
          python3 scripts/03_validate_and_debug_dataset.py --run-self-test
      - name: Run RoboOps Safety & Trajectory Pytest Suite
        run: |
          pytest -v
      - name: Dry-run VLM Active Perception Controller & Report Builder
        run: |
          python3 scripts/01_detect_hardware.py
          python3 scripts/03_vlm_zero_shot_controller.py --dry-run
          python3 scripts/05_build_video_and_report.py
